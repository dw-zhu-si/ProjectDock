name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: node scripts/check-i18n.mjs
      - run: for file in web/js/*.js; do node --check "$file"; done
      - name: Build embedded projectctl
        run: |
          mkdir -p work/build
          go build -o work/build/projectctl-darwin-arm64 ./cmd/projectctl
      - name: Build direct distribution app
        run: xcodebuild -project ProjectDock.xcodeproj -scheme ProjectDock -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Build App Store sandbox variant
        run: xcodebuild -project ProjectDock.xcodeproj -scheme ProjectDock -configuration AppStore CODE_SIGNING_ALLOWED=NO build
